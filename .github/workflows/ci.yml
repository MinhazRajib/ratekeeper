name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Smoke-test the built entry points
        run: |
          node -e "import('./dist/index.js').then(m => { if (!('RateLimiter' in m)) process.exit(1) })"
          node -e "const m = require('./dist/index.cjs'); if (!('RateLimiter' in m)) process.exit(1)"
